
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potato-cli"
version = "0.2.1"
description = "A secure, local-first interactive terminal file browser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
    "typer>=0.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[project.scripts]
potato = "potato.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
